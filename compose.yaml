services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:?Configura el usuario de MongoDB}:${MONGO_ROOT_PASSWORD:?Configura una contraseña de MongoDB en .env}@mongodb:27017/feaster_db?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Define MONGO_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1
      interval: 15s
      timeout: 10s
      retries: 12
    restart: unless-stopped
volumes:
  mongo_data:
